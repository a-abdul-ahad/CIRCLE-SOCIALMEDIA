<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cicle — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="header-placeholder"></div>

  <main class="container">
    <div id="composer-placeholder"></div>
    <div id="feed" ><p>Loading feed...</p></div>
  </main>

  <script src="js/common.js"></script>
  <script>
    requireAuth();
    const currentUser = getUser();

    function renderComposer() {
      const el = document.getElementById("composer-placeholder");
      if (!currentUser) {
        el.innerHTML = `
          <div class="composer">
            <p style="margin:0;color:var(--muted);">
            <a href="login.html" style="color:var(--primary);font-weight:600;">Log in</a> to share something with the community.
            </p>
          </div>`;
        return;
      }
      
      // 1. Updated Composer HTML with the Preview Box
      el.innerHTML = `
        <div class="composer">
          <textarea id="post-content" placeholder="What's on your mind, ${escapeHtml(currentUser.name.split(" ")[0])}?" maxlength="500"></textarea>
          
          <!-- Media Preview Box -->
          <div id="mediaPreviewContainer" style="display: none; position: relative; margin-top: 10px; margin-bottom: 10px; border-radius: 8px; overflow: hidden; background: #1E293B;">
              <button id="removeMediaBtn" style="position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-weight: bold; z-index: 10;">✕</button>
              <img id="imagePreview" style="display: none; width: 100%; max-height: 350px; object-fit: contain;">
              <video id="videoPreview" controls style="display: none; width: 100%; max-height: 350px; object-fit: contain;"></video>
          </div>

          <div class="composer-footer">
            <input type="file" id="mediaUpload" accept="image/*,video/*" style="display: none;">
            <button class="btn btn-primary" id="img-btn" onclick="document.getElementById('mediaUpload').click()">🌆</button>
            <button class="btn btn-primary" id="vid-btn" onclick="document.getElementById('mediaUpload').click()">🎬</button>
            <button class="btn btn-primary" id="post-btn">Post</button>
          </div>
        </div>`;

      // 2. Add Event Listeners for the Preview Box
      const mediaInput = document.getElementById("mediaUpload");
      const previewContainer = document.getElementById("mediaPreviewContainer");
      const imagePreview = document.getElementById("imagePreview");
      const videoPreview = document.getElementById("videoPreview");
      const removeMediaBtn = document.getElementById("removeMediaBtn");

      function clearPreview() {
        mediaInput.value = "";
        previewContainer.style.display = "none";
        imagePreview.src = "";
        videoPreview.src = "";
        imagePreview.style.display = "none";
        videoPreview.style.display = "none";
      }

      mediaInput.addEventListener("change", function() {
        const file = this.files[0];
        if (file) {
          const fileUrl = URL.createObjectURL(file);
          previewContainer.style.display = "block";
          if (file.type.startsWith("video/")) {
            imagePreview.style.display = "none";
            videoPreview.src = fileUrl;
            videoPreview.style.display = "block";
          } else if (file.type.startsWith("image/")) {
            videoPreview.style.display = "none";
            imagePreview.src = fileUrl;
            imagePreview.style.display = "block";
          }
        } else {
          clearPreview();
        }
      });

      removeMediaBtn.addEventListener("click", clearPreview);

      // 3. Updated Post Button Logic (Using FormData)
      const postBtn = document.getElementById("post-btn");
      postBtn.addEventListener("click", async () => {
        const content = document.getElementById("post-content").value.trim();
        const mediaFile = mediaInput.files[0];

        if (!content && !mediaFile) return; // Prevent empty posts

        postBtn.disabled = true;
        postBtn.textContent = "Posting...";

        const formData = new FormData();
        formData.append("content", content);
        if (mediaFile) {
          formData.append("media", mediaFile);
        }

        try {
          await apiFetch("/posts", { 
            method: "POST", 
            body: formData // Send formData instead of JSON
          });
          
          document.getElementById("post-content").value = "";
          clearPreview(); // Clear the preview box after posting
          showToast("Posted!");
          loadFeed();
        } catch (err) {
          showToast(err.message);
        } finally {
          postBtn.disabled = false;
          postBtn.textContent = "Post";
        }
      });
    }

    async function loadFeed() {
      const feed = document.getElementById("feed");
      try {
        const posts = await apiFetch("/posts");
        if (!posts.length) {
          feed.innerHTML = `<div class="empty-state">No posts yet. Be the first to share something!</div>`;
          return;
        }
        feed.innerHTML = posts.map(renderPost).join("");
        attachPostHandlers();
      } catch (err) {
        feed.innerHTML = `<div class="empty-state">Failed to load feed: ${escapeHtml(err.message)}</div>`;
      }
    }

    // 4. Updated renderPost to display the image/video
    function renderPost(post) {
      const liked = currentUser && post.likes.some((id) => (id._id || id) === currentUser._id);
      const isAuthor = currentUser && post.user._id === currentUser._id;
      
      // Determine if current user is following the post author
      const isFollowing = currentUser && currentUser.following && currentUser.following.includes(post.user._id);

      let mediaHtml = "";
      if (post.mediaUrl && post.mediaType === "image") {
        mediaHtml = `<div class="post-media" style="margin-top: 10px;">
                       <img src="${post.mediaUrl}" alt="Post image" style="width: 100%; max-height: 500px; border-radius: 8px; object-fit: cover;">
                     </div>`;
      } else if (post.mediaUrl && post.mediaType === "video") {
        mediaHtml = `<div class="post-media" style="margin-top: 10px;">
                       <video src="${post.mediaUrl}" controls style="width: 100%; max-height: 500px; border-radius: 8px;"></video>
                     </div>`;
      }

      return `
        <div class="post-card" data-post-id="${post._id}">
          <div class="post-head" style="display: flex; align-items: center;">
            <a href="profile.html?username=${post.user.username}"><img class="avatar" src="${post.user.avatar}" alt="${escapeHtml(post.user.name)}" /></a>
            <div style="flex-grow: 1;">
              <a href="profile.html?username=${post.user.username}" style="display: flex; align-items: center; gap: 8px;">
                <div class="post-author">${escapeHtml(post.user.name)}</div>
                
                <!-- Feed Follow Button -->
                ${currentUser && !isAuthor ? `<button class="btn btn-sm ${isFollowing ? 'btn-outline' : 'btn-primary'} feed-follow-btn" data-id="${post.user._id}" data-following="${isFollowing}" style="padding: 2px 8px; font-size: 0.75rem; line-height: 1.2;">${isFollowing ? 'Following' : 'Follow'}</button>` : ''}
              
              </a>
              <div class="post-username">@${post.user.username}</div>
            </div>
            <span class="post-time">${timeAgo(post.createdAt)}</span>
          </div>
          
          <div class="post-content">${escapeHtml(post.content)}</div>
          
          ${mediaHtml}
          
          <div class="post-actions">
            <button class="like-btn ${liked ? "liked" : ""}" data-id="${post._id}">
              ${liked ? "❤️" : "🤍"} <span class="like-count">${post.likes.length}</span>
            </button>
            <button class="comment-toggle" data-id="${post._id}">💬 <span>${post.comments.length}</span></button>
            ${isAuthor ? `<button class="delete-post" data-id="${post._id}" style="margin-left:auto;color:var(--danger);">Delete</button>` : ""}
          </div>
          <div class="comments" id="comments-${post._id}" style="display:none;">
            ${post.comments.map(renderComment).join("")}
            ${
              currentUser
                ? `<div class="comment-form">
                     <input type="text" placeholder="Write a comment..." class="comment-input" data-id="${post._id}" maxlength="300" />
                     <button class="btn btn-primary btn-sm comment-submit" data-id="${post._id}">Send</button>
                   </div>`
                : ""
            }
          </div>
        </div>
      `;
    }

    function renderComment(c) {
      return `
        <div class="comment">
          <img class="avatar-sm" src="${c.userAvatar || c.user?.avatar || ""}" alt="" />
          <div class="comment-body">
            <div class="comment-author">${escapeHtml(c.userName || c.user?.name || "User")}</div>
            <div class="comment-text">${escapeHtml(c.text)}</div>
          </div>
        </div>
      `;
    }

  function attachPostHandlers() {
      // Like Buttons
      document.querySelectorAll(".like-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!currentUser) { window.location.href = "login.html"; return; }
          const id = btn.dataset.id;
          try {
            const res = await apiFetch(`/posts/${id}/like`, { method: "POST" });
            btn.classList.toggle("liked", res.liked);
            btn.innerHTML = `${res.liked ? "❤️" : "🤍"} <span class="like-count">${res.likes.length}</span>`;
          } catch (err) {
            showToast(err.message);
          }
        });
      });

      // Feed Follow Buttons Logic
      document.querySelectorAll(".feed-follow-btn").forEach((btn) => {
        btn.addEventListener("click", async (e) => {
          e.preventDefault(); // Prevent navigating to the profile link wrapper
          const targetId = btn.dataset.id;
          const isFollowingNow = btn.dataset.following === "true";
          
          try {
            // Instantly update UI for snappy user experience
            btn.dataset.following = !isFollowingNow;
            btn.textContent = !isFollowingNow ? "Following" : "Follow";
            btn.className = `btn btn-sm ${!isFollowingNow ? 'btn-outline' : 'btn-primary'} feed-follow-btn`;
            
            // Send API Request
            await apiFetch(`/users/${targetId}/${isFollowingNow ? "unfollow" : "follow"}`, { method: "POST" });
            
            // Update the local storage array silently so other posts reflect the change
            if (currentUser) {
              if (!isFollowingNow) {
                currentUser.following.push(targetId);
              } else {
                currentUser.following = currentUser.following.filter(id => id !== targetId);
              }
              setAuth({ token: getToken(), ...currentUser });
            }
          } catch (err) {
            showToast(err.message);
          }
        });
      });

      // Comment Toggle
      document.querySelectorAll(".comment-toggle").forEach((btn) => {
        btn.addEventListener("click", () => {
          const box = document.getElementById(`comments-${btn.dataset.id}`);
          box.style.display = box.style.display === "none" ? "block" : "none";
        });
      });

      // Submit Comment
      document.querySelectorAll(".comment-submit").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.dataset.id;
          const input = document.querySelector(`.comment-input[data-id="${id}"]`);
          const text = input.value.trim();
          if (!text) return;
          try {
            await apiFetch(`/posts/${id}/comments`, { method: "POST", body: JSON.stringify({ text }) });
            input.value = "";
            loadFeed();
          } catch (err) {
            showToast(err.message);
          }
        });
      });

      // Delete Post
      document.querySelectorAll(".delete-post").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("Delete this post?")) return;
          try {
            await apiFetch(`/posts/${btn.dataset.id}`, { method: "DELETE" });
            loadFeed();
          } catch (err) {
            showToast(err.message);
          }
        });
      });
    }

    renderComposer();
    loadFeed();
  </script>
</body>
</html>
